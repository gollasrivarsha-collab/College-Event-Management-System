<!DOCTYPE html>
<html>

<head>

    <title>Update Event</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<!-- HEADER -->

<div class="header">

    <h1>COLLEGE EVENT MANAGEMENT</h1>

    <p>Update College Event Details</p>

</div>


<!-- NAVIGATION -->

<div class="navbar">

    <a href="index.html">Home</a>

    <a href="list.html">List Events</a>

    <a href="listOne.html">Search Event</a>

    <a href="insert.html">Add Event</a>

    <a href="update.html">Update Event</a>

    <a href="delete.html">Delete Event</a>

</div>


<!-- MAIN CONTENT -->

<div class="container">

    <h1 class="page-title">
        UPDATE EVENT
    </h1>


    <div class="form-container">


        <!-- EVENT ID -->

        <div class="form-group">

            <label>Event ID</label>

            <input
                type="number"
                id="event_id"
                placeholder="Enter Event ID"
            >

        </div>


        <!-- EVENT NAME -->

        <div class="form-group">

            <label>Event Name</label>

            <input
                type="text"
                id="event_name"
                placeholder="Enter Event Name"
            >

        </div>


        <!-- EVENT TYPE -->

        <div class="form-group">

            <label>Event Type</label>

            <input
                type="text"
                id="event_type"
                placeholder="Enter Event Type"
            >

        </div>


        <!-- EVENT DATE -->

        <div class="form-group">

            <label>Event Date</label>

            <input
                type="date"
                id="event_date"
            >

        </div>


        <!-- VENUE -->

        <div class="form-group">

            <label>Venue</label>

            <input
                type="text"
                id="venue"
                placeholder="Enter Venue"
            >

        </div>


        <!-- DESCRIPTION -->

        <div class="form-group">

            <label>Description</label>

            <textarea
                id="description"
                placeholder="Enter Event Description">
            </textarea>

        </div>


        <!-- UPDATE BUTTON -->

        <button
            class="btn"
            onclick="updateEvent()">

            ✏️ Update Event

        </button>


        <button
            class="btn"
            onclick="location.href='index.html'">

            🏠 Home

        </button>


    </div>

</div>


<!-- FOOTER -->

<div class="footer">

    <p>
        © 2026 College Event Management System
    </p>

</div>


<script>


function updateEvent()
{

    let event_id =
        document.getElementById("event_id").value;


    let event_name =
        document.getElementById("event_name").value;


    let event_type =
        document.getElementById("event_type").value;


    let event_date =
        document.getElementById("event_date").value;


    let venue =
        document.getElementById("venue").value;


    let description =
        document.getElementById("description").value;


    // Check required fields

    if(
        event_id == "" ||
        event_name == "" ||
        event_type == "" ||
        event_date == "" ||
        venue == ""
    )
    {

        alert("Please fill all required fields");

        return;

    }


    fetch("/events/" + event_id, {

        method: "PUT",

        headers: {

            "Content-Type":
            "application/json"

        },

        body: JSON.stringify({

            event_name: event_name,

            event_type: event_type,

            event_date: event_date,

            venue: venue,

            description: description

        })

    })


    .then(response => {

        return response.text().then(message => {

            if(!response.ok)

                throw new Error(message);

            return message;

        });

    })


    .then(message => {

        alert(message);

        location.href = "list.html";

    })


    .catch(error => {

        alert(error.message);

    });

}


</script>


</body>

</html>
