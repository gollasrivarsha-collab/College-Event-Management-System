
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Event</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #333;
        }

        header {
            background: #243b55;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background: #141e30;
            padding: 18px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
            font-weight: bold;
        }

        nav a:hover {
            color: #f5c542;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        h2 {
            color: #243b55;
            margin-bottom: 30px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-bottom: 12px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 22px;
            font-size: 16px;
        }

        button {
            background: #dc3545;
            color: white;
            padding: 13px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #b02a37;
        }

        .home {
            display: inline-block;
            margin-top: 25px;
            color: #243b55;
            text-decoration: none;
            font-weight: bold;
        }

        .home:hover {
            color: #dc3545;
        }

        footer {
            background: #243b55;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 50px;
        }

        #message {
            margin-top: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>College Event Management System</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="list.html">List Events</a>
        <a href="listOne.html">List Required Event</a>
        <a href="insert.html">Insert Event</a>
        <a href="update.html">Update Event</a>
        <a href="delete.html">Delete Event</a>
    </nav>

    <div class="container">
        <h2>DELETE EVENT</h2>

        <form id="deleteForm">
            <label for="event_id">Event ID to Delete</label>

            <input type="number" id="event_id"
                   placeholder="Enter Event ID" required>

            <button type="submit">Delete Event</button>
        </form>

        <p id="message"></p>

        <a href="index.html" class="home">Home Page</a>
    </div>

    <footer>
        <p>College Event Management System</p>
    </footer>

    <script>
        document.getElementById("deleteForm").addEventListener("submit",
            async function(e) {
                e.preventDefault();

                const id = document.getElementById("event_id").value;

                try {
                    const response = await fetch(`/events/${id}`, {
                        method: "DELETE"
                    });

                    const result = await response.text();
                    document.getElementById("message").innerText = result;

                } catch (error) {
                    document.getElementById("message").innerText =
                        "Error deleting event!";
                }
            }
        );
    </script>

</body>
</html>
